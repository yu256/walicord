[package]
name = "walicord"
version = "2.5.0"
edition = "2024"
license = "MIT"
default-run = "walicord"

[dependencies]
walicord-application = { path = "../walicord-application" }
walicord-domain = { path = "../walicord-domain" }
walicord-infrastructure = { path = "../walicord-infrastructure", default-features = false }
walicord-i18n = { path = "../walicord-i18n" }
walicord-parser = { path = "../walicord-parser" }
walicord-presentation = { path = "../walicord-presentation" }
parking_lot = "0.12"
serenity = { version = "0.12.5", features = ["client", "gateway", "model", "framework", "standard_framework", "rustls_backend"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "time"] }
dotenvy = "0.15.7"
dashmap = "6.1.0"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
indexmap = "2.12.0"
thiserror = "2.0.17"
url = "2.5.7"
resvg = "0.47"
tiny-skia = "0.12"
futures = "0.3.31"
smallvec = "1.15.1"
arcstr = "1.2.0"
smol_str = "0.3.5"
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
insta = "1"
rstest = "0.26.1"
walicord-ledger = { path = "../walicord-ledger", features = ["test-fixtures"] }

[features]
default = ["ja"]
ja = ["walicord-infrastructure/ja", "walicord-i18n/ja"]
en = ["walicord-infrastructure/en", "walicord-i18n/en"]
