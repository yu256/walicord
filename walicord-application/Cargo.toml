[package]
name = "walicord-application"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", features = ["clock"] }
dashmap = "6.1.0"
fxhash = "0.2.1"
rust_decimal = "1.36.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
smol_str = "0.3.5"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "sync"] }
walicord-domain = { path = "../walicord-domain" }
walicord-ledger = { path = "../walicord-ledger" }

[dev-dependencies]
proptest = "1.10.0"
rstest = "0.26.1"
rust_decimal = "1.36.0"
walicord-infrastructure = { path = "../walicord-infrastructure" }
tokio = { version = "1.48.0", features = ["macros", "time"] }
