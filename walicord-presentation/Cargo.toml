[package]
name = "walicord-presentation"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
icu = { version = "2.2.0", features = ["compiled_data"] }
smol_str = "0.3.5"
strum = { version = "0.27", features = ["derive"] }
thiserror = "2.0.17"
tracing = "0.1"
walicord-application = { path = "../walicord-application" }
walicord-domain = { path = "../walicord-domain" }
walicord-i18n = { path = "../walicord-i18n" }

[features]
test-fixtures = []

[dev-dependencies]
walicord-presentation = { path = ".", features = ["test-fixtures"] }
insta = "1"
rstest = "0.26.1"
